name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM
        run: cargo build --release --target wasm32v1-none
      - uses: actions/upload-artifact@v4
        with:
          name: complyrail_contracts-wasm
          path: target/wasm32v1-none/release/complyrail_contracts.wasm
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - run: cargo clippy 2>&1 || echo "Clippy warnings present (non-blocking)"
      - run: cargo fmt --check 2>&1 || echo "Format issues present (non-blocking)"
