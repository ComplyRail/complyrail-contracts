name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WASM_TARGET: wasm32v1-none
  WASM_NAME: complyrail_contracts
  DOCKER_IMAGE: complyrail-build:latest
  WASM_SIZE_BASELINE: .wasm-size-baseline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM
        run: cargo build --release --target wasm32v1-none
      - uses: actions/upload-artifact@v4
        with:
          name: complyrail_contracts-wasm
          path: target/wasm32v1-none/release/complyrail_contracts.wasm
          if-no-files-found: error
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - run: cargo clippy 2>&1 || echo "Clippy warnings present (non-blocking)"
      - run: cargo fmt --check 2>&1 || echo "Format issues present (non-blocking)"

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Cargo.lock is committed and up to date
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock is missing. It must be committed for reproducible builds."
            exit 1
          fi
          cargo metadata --locked --format-version 1 > /dev/null
          echo "Cargo.lock is present and up to date."

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WASM_TARGET }}
      - name: Build WASM (first pass)
        run: |
          cargo build --locked --release --target "$WASM_TARGET" --target-dir target-repro-1
      - name: Build WASM (second pass)
        run: |
          cargo build --locked --release --target "$WASM_TARGET" --target-dir target-repro-2
      - name: Compare WASM hashes
        run: |
          WASM_PATH_1="target-repro-1/${WASM_TARGET}/release/${WASM_NAME}.wasm"
          WASM_PATH_2="target-repro-2/${WASM_TARGET}/release/${WASM_NAME}.wasm"
          if [ ! -f "$WASM_PATH_1" ]; then
            echo "::error::First build did not produce $WASM_PATH_1"
            exit 1
          fi
          if [ ! -f "$WASM_PATH_2" ]; then
            echo "::error::Second build did not produce $WASM_PATH_2"
            exit 1
          fi
          HASH_1=$(sha256sum "$WASM_PATH_1" | awk '{print $1}')
          HASH_2=$(sha256sum "$WASM_PATH_2" | awk '{print $1}')
          echo "First build hash:  $HASH_1"
          echo "Second build hash: $HASH_2"
          {
            echo "## Reproducible Build"
            echo ""
            echo "| Build | SHA-256 |"
            echo "| ----- | ------- |"
            echo "| First pass  | \`$HASH_1\` |"
            echo "| Second pass | \`$HASH_2\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HASH_1" != "$HASH_2" ]; then
            echo "::error::WASM hashes differ between builds; the build is not reproducible."
            exit 1
          fi
          echo "WASM_SHA256=$HASH_1" >> "$GITHUB_ENV"
          echo "$HASH_1  ${WASM_NAME}.wasm" > wasm-sha256.txt
      - name: Upload WASM hash for release notes
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sha256
          path: wasm-sha256.txt
          if-no-files-found: error

  wasm-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WASM_TARGET }}
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM
        run: |
          cargo build --locked --release --target "$WASM_TARGET"
      - name: Check WASM size budget
        run: |
          WASM_PATH="target/${WASM_TARGET}/release/${WASM_NAME}.wasm"
          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::Build did not produce $WASM_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM_PATH")
          if [ ! -f "$WASM_SIZE_BASELINE" ]; then
            echo "::error::Baseline file $WASM_SIZE_BASELINE is missing."
            exit 1
          fi
          BASELINE=$(tr -d '[:space:]' < "$WASM_SIZE_BASELINE")
          if ! [[ "$BASELINE" =~ ^[0-9]+$ ]]; then
            echo "::error::Baseline file $WASM_SIZE_BASELINE does not contain a valid byte count."
            exit 1
          fi
          DELTA=$((SIZE - BASELINE))
          {
            echo "## WASM Size Budget"
            echo ""
            echo "| Metric | Bytes |"
            echo "| ------ | ----- |"
            echo "| Current size | $SIZE |"
            echo "| Baseline budget | $BASELINE |"
            echo "| Delta | $DELTA |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "WASM size: $SIZE bytes (baseline budget: $BASELINE bytes, delta: $DELTA bytes)"
          if [ "$SIZE" -gt "$BASELINE" ]; then
            echo "::error::WASM size $SIZE bytes exceeds the budget of $BASELINE bytes."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t "$DOCKER_IMAGE" .
          docker image inspect "$DOCKER_IMAGE" > /dev/null
          echo "Built Docker image $DOCKER_IMAGE"

  sdk-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Print resolved soroban-sdk version
        run: |
          echo "Resolved soroban-sdk version:"
          cargo tree -i soroban-sdk 2>&1 || echo "soroban-sdk not found in dependency tree"
      - name: Check SDK lock entry against base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          extract_sdk_entry() {
            # Extract the Cargo.lock package entry for soroban-sdk from a given ref.
            local ref="$1"
            git show "${ref}:Cargo.lock" 2>/dev/null | awk '
              /^\[\[package\]\]/ { in_pkg = 0; buf = $0 "\n"; next }
              { buf = buf $0 "\n" }
              /^name = "soroban-sdk"$/ { in_pkg = 1 }
              in_pkg && /^version = / { print buf; in_pkg = 0 }
            ' || true
          }

          BASE_ENTRY="$(extract_sdk_entry "${BASE_SHA}")"
          HEAD_ENTRY="$(extract_sdk_entry "${HEAD_SHA}")"

          echo "--- Base SDK entry ---"
          echo "${BASE_ENTRY:-<none>}"
          echo "--- Head SDK entry ---"
          echo "${HEAD_ENTRY:-<none>}"

          if [ "${BASE_ENTRY}" = "${HEAD_ENTRY}" ]; then
            echo "SDK lock entry unchanged."
            exit 0
          fi

          echo "SDK lock entry changed between base and head."
          if printf '%s' "${COMMIT_MESSAGE}" | grep -q '\[sdk-bump\]'; then
            echo "Commit message contains [sdk-bump] marker; allowing SDK change."
            exit 0
          fi

          echo "::error::soroban-sdk lock entry changed without an [sdk-bump] marker in the commit message."
          exit 1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x ./deploy.sh ./interact.sh
      - name: Start Stellar quickstart (local network)
        run: |
          set -euo pipefail
          docker run -d --name stellar \
            -p 8000:8000 \
            stellar/quickstart:latest \
            --local
      - name: Wait for RPC endpoint to become ready
        run: |
          set -euo pipefail
          echo "Waiting for Stellar quickstart RPC endpoint..."
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:8000/soroban/rpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' >/dev/null 2>&1; then
              echo "RPC endpoint is ready."
              exit 0
            fi
            echo "Attempt $i/60: not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "RPC endpoint did not become ready in time." >&2
          docker logs stellar || true
          exit 1
      - name: Dry-run deploy
        run: ./deploy.sh testnet --yes --dry-run
      - name: Run interact actions
        run: |
          set -euo pipefail
          for action in deploy initialise register-vasp set-threshold submit-payment; do
            echo "Running interact.sh action: $action"
            ./interact.sh testnet "$action" --yes
          done
      - name: Dump quickstart logs on failure
        if: failure()
        run: docker logs stellar || true
      - name: Stop quickstart container
        if: always()
        run: docker rm -f stellar || true

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt
      - name: Start local network
        run: |
          stellar network start local
          stellar keys generate deployer --network local --fund
          stellar keys generate caller --network local --fund
          stellar keys generate vasp --network local --fund
          stellar keys generate beneficiary --network local --fund
      - name: Deploy contract
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/*.wasm \
            --source deployer \
            --network local)
          echo "CONTRACT_ID=$CONTRACT_ID" >> "$GITHUB_ENV"
      - name: Resolve addresses and public key
        run: |
          CALLER_ADDRESS=$(stellar keys address caller)
          VASP_ADDRESS=$(stellar keys address vasp)
          BENEFICIARY_ADDRESS=$(stellar keys address beneficiary)
          PUBLIC_KEY=$(stellar keys show vasp --show-secret | head -n 1)
          echo "CALLER_ADDRESS=$CALLER_ADDRESS" >> "$GITHUB_ENV"
          echo "VASP_ADDRESS=$VASP_ADDRESS" >> "$GITHUB_ENV"
          echo "BENEFICIARY_ADDRESS=$BENEFICIARY_ADDRESS" >> "$GITHUB_ENV"
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Smoke test status
        run: |
          set -euo pipefail
          ./interact.sh status
      - name: Smoke test register-vasp
        run: |
          set -euo pipefail
          ./interact.sh register-vasp \
            --caller "$CALLER_ADDRESS" \
            --vasp "$VASP_ADDRESS" \
            --name "Smoke VASP" \
            --jurisdiction "US" \
            --public-key "$PUBLIC_KEY" \
            --expiry-days 365
      - name: Smoke test submit-payment
        run: |
          set -euo pipefail
          ./interact.sh submit-payment \
            --from-vasp "$CALLER_ADDRESS" \
            --to-vasp "$VASP_ADDRESS" \
            --beneficiary "$BENEFICIARY_ADDRESS" \
            --asset "USDC" \
            --amount 100
      - name: Stop local network
        if: always()
        run: |
          stellar network stop local || true
